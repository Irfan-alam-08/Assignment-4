<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main class="container mx-auto scroll-m-0 p-5 sm:p-0">
        <!-- HEADER PART -->
        <header class="py-7 sm:mt-10 border-b border-gray-700">
            <h1 class="sm:text-4xl text-xl font-bold">Job Application Tracker</h1>

            <figure class="grid sm:grid-cols-3 grid-cols-2 w-full gap-5 mt-5">
                <div class="card w-full bg-base-300 card-xs shadow-sm sm:p-4 p-2 border border-gray-700">
                    <div class="card-body">
                        <h2 class="card-title sm:text-lg text-sm font-semibold text-gray-400">
                            Total
                        </h2>
                        <p id="totalJobs" class="font-bold sm:text-3xl text-xl">0</p>
                    </div>
                </div>
                <div class="card w-full bg-base-300 card-xs shadow-sm sm:p-4 p-2 border border-gray-700">
                    <div class="card-body">
                        <h2 class="card-title sm:text-lg text-sm font-semibold text-gray-400">
                            Interview
                        </h2>
                        <p id="totalInterview" class="font-bold sm:text-3xl text-xl text-green-400">0</p>
                    </div>
                </div>
                <div
                    class="card sm:col-span-1 col-span-2 w-full bg-base-300 card-xs shadow-sm sm:p-4 p-2 border border-gray-700">
                    <div class="card-body">
                        <h2 class="card-title sm:text-lg text-sm font-semibold text-gray-400">
                            Rejected
                        </h2>
                        <p id="totalRejected" class="font-bold sm:text-3xl text-xl text-red-400">0</p>
                    </div>
                </div>
            </figure>
        </header>

        <!-- AVAILABLE JOBS PART -->
        <section class="py-6 pb-20">
            <!-- TOP NAVIGATION PART -->
            <div class="py-2">
                <div class="mb-4 flex items-center justify-between w-full">
                    <h1 class="font-bold sm:text-3xl text-xl">Available Jobs</h1>
                    <span id="availableJobs" class="font-semibold sm:text-xl text-md text-gray-300">0 Jobs</span>
                </div>
                <div class="flex items-center gap-3 flex-wrap">
                    <button onclick="setActiveButton(this); filterCards('all')" id="all-filter-btn" data-value="all"
                        class="tabButton btn px-7 border-gray-700">All</button>
                    <button onclick="setActiveButton(this); filterCards('interview')" id="interview-filter-btn"
                        data-value="interview" class="tabButton btn px-7 border-gray-700">Interview</button>
                    <button onclick="setActiveButton(this); filterCards('rejected')" id="rejected-filter-btn"
                        data-value="rejected" class="tabButton btn px-7 border-gray-700">Rejected</button>
                </div>
            </div>

            <!-- BOTTOM PART - ALL JOB CONTAINER -->
            <div id="jobCardContainer" class="w-full mt-5 flex flex-col gap-5">

                <!-- CARD 1 -->
                <div data-status="all"
                    class=" job-card card bg-base-200 w-full border border-base-content/10 shadow-xl">
                    <div class="card-body gap-3 p-6">

                        <!-- Top row: title + delete btn -->
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="card-title text-base-content font-bold text-xl">Mobile First Corp</h2>
                                <p class="text-base-content/50 text-sm mt-0.5">React Native Developer</p>
                            </div>
                            <button
                                class="delete-btn btn btn-ghost btn-sm btn-square text-base-content/30 hover:text-error hover:bg-error/10 border border-base-content/10">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    viewBox="0 0 24 24">
                                    <path
                                        d="M9 3h6l1 1h4v2H4V4h4L9 3zm-5 4h16l-1.5 13.5A1.5 1.5 0 0 1 18 22H6a1.5 1.5 0 0 1-1.5-1.5L3 7zm5 3v7h2v-7H8zm4 0v7h2v-7h-2z" />
                                </svg>
                            </button>
                        </div>

                        <!-- Meta info -->
                        <div class="flex flex-wrap items-center gap-1 text-base-content/60 text-sm font-semibold">
                            <span>Remote</span>
                            <span class="mx-1 text-base-content/20">•</span>
                            <span>Full-time</span>
                            <span class="mx-1 text-base-content/20">•</span>
                            <span>$130,000 - $175,000</span>
                        </div>

                        <!-- Status badge: NOT APPLIED (outline, neutral) -->
                        <div>
                            <span
                                class=" notApp-badge badge badge-outline badge-md font-bold tracking-widest uppercase px-4 py-3 text-base-content/60">Not
                                Applied</span>
                        </div>

                        <div class="divider my-0"></div>

                        <!-- Description -->
                        <p class="text-base-content/50 text-sm leading-relaxed">
                            Build cross-platform mobile applications using React Native. Work on products used by
                            millions of users worldwide.
                        </p>

                        <!-- Action buttons -->
                        <div class="card-actions mt-1">
                            <button
                                class=" interview-btn btn btn-outline btn-success btn-sm font-bold tracking-widest uppercase">Interview</button>
                            <button
                                class=" rejected-btn btn btn-outline btn-error btn-sm font-bold tracking-widest uppercase">Rejected</button>
                        </div>

                    </div>
                </div>
            </div>
            
        </section>

    </main>
    <!-- SCRIPT FILES -->
    <script src="scripts/main.js"></script>
</body>

</html>
